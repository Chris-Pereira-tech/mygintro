<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANAND MELAVA — Crimson Stardust & Ruby Cinematic Intro</title>
  <!-- Tailwind CSS for cinema HUD and control buttons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bebas Neue & Inter for pristine modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --red-primary: #e6194b;
      --red-glow: #ff2a5f;
      --red-deep: #8b0024;
      --crimson-core: #ff1e56;
      --ruby-light: #ffe5ec;
      --ruby-accent: #ff0055;
      --ruby-gold: #ffb4a2;
      --speed-mult: 1;

      /* Dynamic glide offsets calculated via JS */
      --glide-x-a: 0px;
      --glide-x-m: 0px;
      --hero-scale: 1.58;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #070204;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    /* ==========================================================================
       CINEMA STAGE & RED AMBIENT GLOW VIGNETTE
       ========================================================================== */
    #cinema-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(225, 29, 72, 0.24) 0%, rgba(136, 19, 55, 0.12) 38%, rgba(7, 2, 4, 0.95) 75%, rgba(4, 1, 2, 1) 100%);
      perspective: 1400px;
      overflow: hidden;
    }

    /* 3D Dynamic Gyroscope & Mouse Parallax Rig */
    .parallax-rig {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      will-change: transform;
      pointer-events: none;
      transition: transform 0.08s cubic-bezier(0.2, 0, 0.2, 1);
    }

    /* Anamorphic ruby light streak across the horizon */
    .anamorphic-beam {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140vw;
      height: 3px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(255, 42, 95, 0.05) 15%, 
        rgba(255, 42, 95, 0.5) 45%, 
        rgba(255, 255, 255, 0.9) 50%, 
        rgba(255, 42, 95, 0.5) 55%, 
        rgba(255, 42, 95, 0.05) 85%, 
        transparent 100%
      );
      filter: blur(1.5px) drop-shadow(0 0 16px rgba(255, 42, 95, 0.8));
      opacity: 0.45;
      pointer-events: none;
      z-index: 2;
    }

    /* ==========================================================================
       OPTICAL LENS FLARE & CINEMATIC GHOSTING SYSTEM
       ========================================================================== */
    .lens-flare-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
      mix-blend-mode: screen;
      overflow: hidden;
      opacity: 0.75;
      transition: opacity 0.5s ease;
    }

    .flare-corona {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 480px;
      height: 480px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 42, 95, 0.45) 0%, rgba(255, 30, 86, 0.15) 30%, transparent 70%);
      border-radius: 50%;
      filter: blur(28px);
      animation: corona-pulse calc(5.5s / var(--speed-mult)) ease-in-out infinite;
    }

    @keyframes corona-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
      38% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.95; }
      55% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
    }

    .flare-ghost {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform;
      mix-blend-mode: screen;
      transition: transform 0.05s linear;
    }

    .ghost-1 {
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(255, 80, 120, 0.4) 0%, rgba(255, 42, 95, 0.1) 60%, transparent 80%);
      border: 1px solid rgba(255, 140, 170, 0.25);
    }

    .ghost-2 {
      width: 58px;
      height: 58px;
      background: radial-gradient(circle, rgba(255, 230, 240, 0.55) 0%, rgba(255, 42, 95, 0.2) 65%, transparent 85%);
      box-shadow: 0 0 20px rgba(255, 42, 95, 0.5);
    }

    .ghost-3 {
      width: 170px;
      height: 170px;
      background: radial-gradient(circle, rgba(255, 30, 86, 0.2) 0%, rgba(139, 0, 36, 0.08) 55%, transparent 75%);
      border: 1.5px solid rgba(255, 42, 95, 0.18);
    }

    .ghost-4 {
      width: 32px;
      height: 32px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 90, 140, 0.3) 50%, transparent 80%);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    /* Transition Shockwave Pulse Ring */
    #shockwave-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      margin-left: -160px;
      margin-top: -160px;
      border-radius: 50%;
      border: 2px solid rgba(255, 42, 95, 0.85);
      box-shadow: 0 0 45px rgba(255, 30, 86, 0.7), inset 0 0 35px rgba(255, 42, 95, 0.5);
      pointer-events: none;
      z-index: 12;
      opacity: 0;
      transform: scale(0.2);
      animation: shockwave-burst calc(5.5s / var(--speed-mult)) cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes shockwave-burst {
      0%, 36% {
        opacity: 0;
        transform: scale(0.2);
      }
      38% {
        opacity: 0.95;
        transform: scale(0.35);
      }
      52% {
        opacity: 0;
        transform: scale(3.6);
      }
      100% {
        opacity: 0;
        transform: scale(4.0);
      }
    }

    /* Glowing crimson radial core */
    .crimson-nebula-core {
      position: absolute;
      width: 750px;
      height: 520px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 42, 95, 0.18) 0%, rgba(159, 18, 57, 0.08) 50%, transparent 75%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 2;
    }

    /* Stardust & Ember particle background canvas */
    #starfield-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* ==========================================================================
       UNIFIED WORDMARK STAGE: SEAMLESS AM GLIDE & WORDMARK UNFURL
       ========================================================================== */
    #wordmark-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 20;
      will-change: transform, opacity;
      animation: stage-reveal calc(5.5s / var(--speed-mult)) ease-out forwards;
    }

    @keyframes stage-reveal {
      0% {
        opacity: 1;
        transform: scale(1.05);
      }
      40% {
        opacity: 1;
        transform: scale(1.02);
      }
      70% {
        opacity: 1;
        transform: scale(1.0);
      }
      100% {
        opacity: 1;
        transform: scale(1.0);
      }
    }

    .wordmark-row {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(2px, 0.55vw, 9px);
      padding: 0 24px;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .char-slot {
      display: inline-flex;
      align-items: flex-end;
      position: relative;
      will-change: transform, opacity, filter;
    }

    /* ==========================================================================
       HERO ANCHORS: "A" (INDEX 0) AND "M" (INDEX 6)
       Phase 1: Center stage as Monogram
       Phase 2: Glide cleanly outwards into title anchor slots
       ========================================================================== */
    .char-slot.hero-lead-a {
      z-index: 10;
      animation: hero-a-glide calc(5.5s / var(--speed-mult)) cubic-bezier(0.2, 0.9, 0.25, 1) forwards;
    }

    .char-slot.hero-lead-m {
      z-index: 10;
      animation: hero-m-glide calc(5.5s / var(--speed-mult)) cubic-bezier(0.2, 0.9, 0.25, 1) forwards;
    }

    @keyframes hero-a-glide {
      0% {
        opacity: 0;
        transform: translate3d(var(--glide-x-a, 0px), 0px, 0px) scale(calc(var(--hero-scale) * 0.45));
        filter: blur(14px) brightness(2.6);
      }
      18% {
        opacity: 1;
        transform: translate3d(var(--glide-x-a, 0px), 0px, 0px) scale(calc(var(--hero-scale) * 1.05));
        filter: blur(0px) brightness(1.5) drop-shadow(0 0 35px rgba(255, 42, 95, 0.95));
      }
      36% {
        /* Hold position as Monogram center */
        opacity: 1;
        transform: translate3d(var(--glide-x-a, 0px), 0px, 0px) scale(var(--hero-scale));
        filter: blur(0px) brightness(1.3) drop-shadow(0 0 45px rgba(255, 42, 95, 0.9));
      }
      40% {
        /* Glide begins with energy pulse */
        opacity: 1;
        transform: translate3d(var(--glide-x-a, 0px), -2px, 0px) scale(calc(var(--hero-scale) * 1.04));
        filter: blur(0px) brightness(1.6) drop-shadow(0 0 55px rgba(255, 42, 95, 1));
      }
      68% {
        /* Arrives at title slot smoothly */
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.15) drop-shadow(0 0 26px rgba(255, 42, 95, 0.7));
      }
      85% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.05) drop-shadow(0 0 18px rgba(255, 42, 95, 0.55));
      }
      100% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.0) drop-shadow(0 0 14px rgba(255, 42, 95, 0.4));
      }
    }

    @keyframes hero-m-glide {
      0% {
        opacity: 0;
        transform: translate3d(var(--glide-x-m, 0px), 0px, 0px) scale(calc(var(--hero-scale) * 0.45));
        filter: blur(14px) brightness(2.6);
      }
      20% {
        opacity: 1;
        transform: translate3d(var(--glide-x-m, 0px), 0px, 0px) scale(calc(var(--hero-scale) * 1.05));
        filter: blur(0px) brightness(1.5) drop-shadow(0 0 35px rgba(255, 42, 95, 0.95));
      }
      36% {
        /* Hold position as Monogram center */
        opacity: 1;
        transform: translate3d(var(--glide-x-m, 0px), 0px, 0px) scale(var(--hero-scale));
        filter: blur(0px) brightness(1.3) drop-shadow(0 0 45px rgba(255, 42, 95, 0.9));
      }
      40% {
        /* Glide begins with energy pulse */
        opacity: 1;
        transform: translate3d(var(--glide-x-m, 0px), -2px, 0px) scale(calc(var(--hero-scale) * 1.04));
        filter: blur(0px) brightness(1.6) drop-shadow(0 0 55px rgba(255, 42, 95, 1));
      }
      68% {
        /* Arrives at title slot smoothly */
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.15) drop-shadow(0 0 26px rgba(255, 42, 95, 0.7));
      }
      85% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.05) drop-shadow(0 0 18px rgba(255, 42, 95, 0.55));
      }
      100% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.0) drop-shadow(0 0 14px rgba(255, 42, 95, 0.4));
      }
    }

    /* ==========================================================================
       FOLLOWER CHARACTERS ("NAND" & "ELAVA")
       Unfurl smoothly in the wake of A and M during Phase 2
       ========================================================================== */
    .char-slot.follower-char {
      z-index: 4;
      opacity: 0;
      animation: follower-unfurl calc(5.5s / var(--speed-mult)) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: calc(var(--char-delay, 0s) / var(--speed-mult));
    }

    @keyframes follower-unfurl {
      0%, 42% {
        opacity: 0;
        transform: translate3d(var(--unfurl-from-x, -20px), 8px, 0px) scale(0.65);
        filter: blur(8px) brightness(2.0);
      }
      55% {
        opacity: 0.75;
        transform: translate3d(calc(var(--unfurl-from-x, -20px) * 0.4), 3px, 0px) scale(0.9);
        filter: blur(3px) brightness(1.4);
      }
      72% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.1);
      }
      100% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0px) scale(1.0);
        filter: blur(0px) brightness(1.0);
      }
    }

    /* ==========================================================================
       ARCHED TYPOGRAPHY STYLING & SHIMMER
       ========================================================================== */
    .arch-char {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 9.8vw, 9.4rem);
      line-height: 0.88;
      background: linear-gradient(180deg, #ffffff 0%, #ffd0d9 38%, #ff2a5f 75%, #9e0128 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      position: relative;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-shadow: 0 16px 36px rgba(0, 0, 0, 0.9);
      transform-origin: 50% 100%;
    }

    .arch-space {
      width: clamp(18px, 3.2vw, 48px);
      display: inline-block;
    }

    .arch-char.anchor-am {
      background: linear-gradient(180deg, #ffffff 0%, #ffe3e8 32%, #ff2a5f 70%, #b3002d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(255, 42, 95, 0.75));
    }

    /* ==========================================================================
       REAL-TIME AUDIO SPECTRUM VISUALIZER RIBBON
       ========================================================================== */
    .visualizer-canvas {
      position: absolute;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      width: min(88vw, 620px);
      height: 40px;
      pointer-events: none;
      z-index: 25;
      opacity: 0.85;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 10px rgba(255, 42, 95, 0.7));
    }

    /* Ambient warm crimson floor reflection */
    .wordmark-glow-floor {
      width: min(88vw, 1020px);
      height: 52px;
      margin-top: -10px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 42, 95, 0.5) 0%, rgba(179, 0, 45, 0.18) 45%, rgba(0, 0, 0, 0) 78%);
      filter: blur(15px);
      transform: scaleY(0.55);
      opacity: 0;
      animation: badge-fade-in calc(5.5s / var(--speed-mult)) ease forwards;
    }

    .presents-badge-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 1.4rem;
      opacity: 0;
      animation: badge-fade-in calc(5.5s / var(--speed-mult)) ease forwards;
    }

    .badge-line {
      width: clamp(24px, 4vw, 56px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 42, 95, 0.8), transparent);
    }

    .presents-badge {
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.48em;
      font-size: clamp(0.65rem, 1.1vw, 0.88rem);
      color: rgba(255, 230, 235, 0.85);
      text-transform: uppercase;
      font-weight: 500;
      text-shadow: 0 0 14px rgba(255, 42, 95, 0.45);
    }

    @keyframes badge-fade-in {
      0%, 65% {
        opacity: 0;
        transform: translateY(10px);
      }
      82% {
        opacity: 0.8;
        transform: translateY(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .paused * {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- MAIN CINEMA VIEWPORT -->
  <main id="cinema-viewport">

    <!-- 3D PARALLAX CAMERA RIG -->
    <div id="parallax-rig" class="parallax-rig">
      <!-- Anamorphic Ruby Beam & Core Glow -->
      <div class="anamorphic-beam"></div>
      <div class="crimson-nebula-core"></div>
      <div id="shockwave-ring"></div>

      <!-- Optical Lens Flare & Aperture Ghosts -->
      <div id="lens-flare-layer" class="lens-flare-layer">
        <div id="flare-ghost-1" class="flare-ghost ghost-1"></div>
        <div id="flare-ghost-2" class="flare-ghost ghost-2"></div>
        <div id="flare-ghost-3" class="flare-ghost ghost-3"></div>
        <div id="flare-ghost-4" class="flare-ghost ghost-4"></div>
        <div class="flare-corona"></div>
      </div>

      <!-- Starfield / Ember canvas background -->
      <canvas id="starfield-canvas"></canvas>

      <!-- ======================================================================
           UNIFIED WORDMARK STAGE: HERO "AM" GLIDES SEAMLESSLY INTO "ANAND MELAVA"
           ====================================================================== -->
      <div id="wordmark-stage">
        <div class="presents-badge-wrapper">
          <span class="badge-line"></span>
          <span class="presents-badge">An Original Cinematic Experience</span>
          <span class="badge-line"></span>
        </div>
        <div id="arched-wordmark" class="wordmark-row" aria-label="ANAND MELAVA">
          <!-- Populated dynamically with mathematically aligned glide coords -->
        </div>
        <div class="wordmark-glow-floor"></div>
      </div>
    </div>

    <!-- Real-time Audio Spectrum Visualizer Ribbon -->
    <canvas id="visualizer-canvas" class="visualizer-canvas" width="620" height="40"></canvas>

    <!-- ======================================================================
         TOP ARCHITECTURAL TELEMETRY BAR
         ====================================================================== -->
    <div id="hud-top" class="fixed top-4 left-4 right-4 flex flex-wrap items-center justify-between gap-3 z-40 pointer-events-none transition-opacity duration-500">
      <div class="pointer-events-auto flex items-center gap-3 bg-neutral-950/85 border border-red-500/25 backdrop-blur-md px-3.5 py-2 rounded-full shadow-2xl">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shadow-[0_0_10px_#ff2a5f]"></span>
        <span class="text-xs font-medium tracking-wider uppercase text-neutral-300">
          Theme: <strong id="theme-name-display" class="text-rose-400">Crimson Stardust & Ruby</strong>
        </span>
        <span id="phase-indicator" class="text-xs px-2.5 py-0.5 rounded-full bg-red-950/80 border border-red-500/35 text-rose-200 font-medium">
          Phase 1: Radiant "AM" Ruby Ignition
        </span>
      </div>

      <!-- Studio Palette Preset Chips -->
      <div class="pointer-events-auto flex items-center gap-1.5 bg-neutral-950/85 border border-white/10 backdrop-blur-md px-2.5 py-1.5 rounded-full text-xs shadow-2xl">
        <span class="text-neutral-400 font-medium mr-1 hidden sm:inline">Universe:</span>
        <button data-theme="crimson" class="theme-chip px-2.5 py-0.5 rounded-full bg-rose-600/30 border border-rose-500/60 text-rose-200 font-medium transition active:scale-95" title="Crimson Ruby (Key 1)">Crimson</button>
        <button data-theme="cyberpunk" class="theme-chip px-2.5 py-0.5 rounded-full bg-white/5 border border-transparent text-neutral-400 hover:text-white transition active:scale-95" title="Cyberpunk Neon (Key 2)">Cyber</button>
        <button data-theme="gold" class="theme-chip px-2.5 py-0.5 rounded-full bg-white/5 border border-transparent text-neutral-400 hover:text-white transition active:scale-95" title="Paramount Gold (Key 3)">Gold</button>
        <button data-theme="emerald" class="theme-chip px-2.5 py-0.5 rounded-full bg-white/5 border border-transparent text-neutral-400 hover:text-white transition active:scale-95" title="Emerald Matrix (Key 4)">Matrix</button>
      </div>

      <div class="pointer-events-auto hidden xl:flex items-center gap-2 bg-neutral-950/85 border border-white/10 backdrop-blur-md px-3.5 py-1.5 rounded-full text-xs text-neutral-400 shadow-2xl">
        <span class="text-rose-400 font-semibold">AM Monogram</span>
        <span>→</span>
        <span class="text-red-400">Glide Transition</span>
        <span>→</span>
        <span class="text-white font-semibold">ANAND MELAVA</span>
      </div>
    </div>

    <!-- ======================================================================
         BOTTOM INTERACTIVE DIRECTOR BAR
         ====================================================================== -->
    <div id="hud-bottom" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 flex flex-wrap items-center justify-center gap-2.5 bg-neutral-950/90 border border-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-2xl transition-opacity duration-500 w-[92vw] max-w-2xl">
      <button id="btn-replay" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 active:scale-95 text-xs sm:text-sm font-medium text-white transition">
        <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Replay Intro</span>
      </button>

      <button id="btn-sound" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-500 active:scale-95 text-xs sm:text-sm font-semibold text-white shadow-lg shadow-red-950/70 border border-red-400/30 transition">
        <svg id="sound-icon-on" class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">

          <svg id="volume-icon" class="w-3.5 h-3.5 text-rose-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" />

        <button data-speed="1" class="speed-btn px-2.5 py-1 rounded-lg text-xs bg-white/15 text-white font-medium transition">1x Normal</button>
      </div>
    </div>

  </main>

  <script>
    /**
     * ========================================================================
     * 1. CRIMSON EMBERS & RUBY STARDUST PARTICLE ENGINE
     * ========================================================================
     */
    const canvas = document.getElementById('starfield-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let explosionSparks = [];
    let animationFrameId = null;

    const emberColors = [
      '#ff2a5f', // vibrant ruby glow
      '#ff1e56', // incandescent crimson
      '#ff758f', // warm rose
      '#ffb4a2', // ruby-gold spark
      '#ffffff'  // white specular highlight
    ];

    function initStarfield() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      stars = [];
      const count = Math.floor((window.innerWidth * window.innerHeight) / 7500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 1.8 + 0.4,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.007 + 0.002,
          vy: -(Math.random() * 0.35 + 0.1),
          vx: (Math.random() - 0.5) * 0.18,
          color: emberColors[Math.floor(Math.random() * emberColors.length)],
          isEmber: Math.random() > 0.4
        });
      }
    }

    function spawnSparkBurst(originX, originY, count = 75, speedMult = 1.0) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = (Math.random() * 7.5 + 2.0) * speedMult;
        explosionSparks.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * velocity,
          vy: Math.sin(angle) * velocity,
          radius: Math.random() * 2.8 + 0.8,
          alpha: 1.0,
          decay: Math.random() * 0.016 + 0.012,
          color: emberColors[Math.floor(Math.random() * emberColors.length)],
          trail: []
        });
      }
    }

    function renderStarfield() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      // Render ambient drifting embers
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 0.95 || s.alpha < 0.15) s.speed = -s.speed;

        s.y += s.vy;
        s.x += s.vx;
        if (s.y < -10) s.y = window.innerHeight + 10;
        if (s.x < -10) s.x = window.innerWidth + 10;
        if (s.x > window.innerWidth + 10) s.x = -10;

        ctx.save();
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.globalAlpha = Math.abs(s.alpha);

        if (s.isEmber) {
          ctx.shadowBlur = 8;
          ctx.shadowColor = s.color;
        }

        ctx.fill();
        ctx.restore();
      });

      // Render kinetic explosion sparks with comet trails
      for (let i = explosionSparks.length - 1; i >= 0; i--) {
        const sp = explosionSparks[i];
        sp.trail.push({ x: sp.x, y: sp.y });
        if (sp.trail.length > 5) sp.trail.shift();

        // Render comet trail
        if (sp.trail.length > 1) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(sp.trail[0].x, sp.trail[0].y);
          for (let t = 1; t < sp.trail.length; t++) {
            ctx.lineTo(sp.trail[t].x, sp.trail[t].y);
          }
          ctx.strokeStyle = sp.color;
          ctx.lineWidth = sp.radius * 0.75;
          ctx.globalAlpha = sp.alpha * 0.45;
          ctx.stroke();
          ctx.restore();
        }

        // Render spark core
        ctx.save();
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.radius, 0, Math.PI * 2);
        ctx.fillStyle = sp.color;
        ctx.globalAlpha = sp.alpha;
        ctx.shadowBlur = 10;
        ctx.shadowColor = sp.color;
        ctx.fill();
        ctx.restore();

        // Physics update
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vx *= 0.96;
        sp.vy = sp.vy * 0.96 + 0.05; // gentle gravity
        sp.alpha -= sp.decay;

        if (sp.alpha <= 0) {
          explosionSparks.splice(i, 1);
        }
      }

      animationFrameId = requestAnimationFrame(renderStarfield);
    }

    window.addEventListener('resize', () => {
      initStarfield();
    });

    /**
     * ========================================================================
     * 2. ARCHED 3D WORDMARK WITH UNIFIED SEAMLESS "AM" GLIDE TRANSITION
     * ========================================================================
     */
    function buildArchedWordmark() {
      const text = 'ANAND MELAVA';
      const container = document.getElementById('arched-wordmark');
      container.innerHTML = '';

      const chars = text.split('');
      const midIndex = (chars.length - 1) / 2;
      const slotElements = [];

      chars.forEach((ch, idx) => {
        if (ch === ' ') {
          const spacer = document.createElement('span');
          spacer.className = 'arch-space';
          container.appendChild(spacer);
          slotElements.push(null);
          return;
        }

        const slot = document.createElement('span');
        slot.className = 'char-slot';

        const span = document.createElement('span');
        span.className = 'arch-char';
        span.textContent = ch;

        const normDist = (idx - midIndex) / midIndex;
        const absDist = Math.abs(normDist);

        // Elegant cinema arch curvature
        const scaleY = 1 + Math.pow(absDist, 1.85) * 0.22;
        const translateY = Math.pow(absDist, 2) * 14;
        const rotateZ = normDist * -4.2;

        span.style.transform = `translateY(${translateY.toFixed(1)}px) scaleY(${scaleY.toFixed(3)}) rotateZ(${rotateZ.toFixed(2)}deg)`;

        if (idx === 0) {
          // 'A' Hero Anchor
          slot.classList.add('hero-lead-a');
          span.classList.add('anchor-am');
        } else if (idx === 6) {
          // 'M' Hero Anchor
          slot.classList.add('hero-lead-m');
          span.classList.add('anchor-am');
        } else {
          // Follower letters: N, A, N, D & E, L, A, V, A
          slot.classList.add('follower-char');
          const distFromLead = idx < 5 ? idx : (idx - 6);
          const unfurlOffset = idx < 5 ? (-18 * distFromLead) : (18 * distFromLead);
          slot.style.setProperty('--unfurl-from-x', `${unfurlOffset}px`);
          slot.style.setProperty('--char-delay', `${0.04 * distFromLead}s`);
        }

        slot.appendChild(span);
        container.appendChild(slot);
        slotElements.push(slot);
      });

      // Compute exact glide coordinates
      requestAnimationFrame(() => {
        computeGlideOffsets(slotElements);
      });
    }

    /**
     * Compute exact pixel coordinates for the central "AM" monogram
     * relative to their final rest positions in the wordmark row.
     */
    function computeGlideOffsets(slotElements) {
      const container = document.getElementById('arched-wordmark');
      if (!container) return;

      const slots = slotElements || Array.from(container.querySelectorAll('.char-slot'));
      const slotA = slots[0];
      const slotM = slots[6]; // index 6 is 'M'
      if (!slotA || !slotM) return;

      const containerWidth = container.offsetWidth;
      const centerX = containerWidth / 2;

      const widthA = slotA.offsetWidth || 80;
      const widthM = slotM.offsetWidth || 80;

      // Centered monogram pair with visually balanced cinema gap
      const monogramGap = Math.max(16, widthA * 0.22);
      const targetCenterA = centerX - (widthA / 2) - (monogramGap / 2);
      const targetCenterM = centerX + (widthM / 2) + (monogramGap / 2);

      const finalCenterA = slotA.offsetLeft + (widthA / 2);
      const finalCenterM = slotM.offsetLeft + (widthM / 2);

      const deltaA = targetCenterA - finalCenterA;
      const deltaM = targetCenterM - finalCenterM;

      document.documentElement.style.setProperty('--glide-x-a', `${deltaA.toFixed(1)}px`);
      document.documentElement.style.setProperty('--glide-x-m', `${deltaM.toFixed(1)}px`);
    }

    /**
     * ========================================================================
     * 3. CINEMATIC WEB AUDIO SYNTHESIZER & REAL-TIME SPECTRUM ANALYSER
     * ========================================================================
     */
    let audioCtx = null;
    let masterGain = null;
    let analyser = null;
    let analyserData = null;
    let isAudioPlaying = false;

    function initAudioEngine() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.78;
        analyserData = new Uint8Array(analyser.frequencyBinCount);

        masterGain.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCinematicAudio(speedMult = 1) {
      try {
        initAudioEngine();

        isAudioPlaying = true;
        const soundBtnText = document.getElementById('sound-btn-text');
        if (soundBtnText) soundBtnText.textContent = 'Audio Playing...';

        const now = audioCtx.currentTime;
        const invSpeed = 1 / speedMult;

        // 1. Sub-Bass Cinema Boom (Monogram Ignition)
        const subOsc = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(115, now + 0.08 * invSpeed);
        subOsc.frequency.exponentialRampToValueAtTime(36, now + 1.9 * invSpeed);
        subGain.gain.setValueAtTime(0.0001, now + 0.08 * invSpeed);
        subGain.gain.linearRampToValueAtTime(0.68, now + 0.14 * invSpeed);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.3 * invSpeed);
        subOsc.connect(subGain).connect(masterGain);
        subOsc.start(now + 0.08 * invSpeed);
        subOsc.stop(now + 2.4 * invSpeed);

        // 2. Crystal Ruby Chimes
        function triggerChime(startTime, freq, duration) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.38, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain).connect(masterGain);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.05);
        }
        triggerChime(now + 0.2 * invSpeed, 523.25, 2.2 * invSpeed); // C5
        triggerChime(now + 0.7 * invSpeed, 659.25, 2.5 * invSpeed); // E5

        // 3. Transition Stardust Whoosh with Spatial Stereo Panning
        const bufferSize = audioCtx.sampleRate * 1.5;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 3.2;
        const whooshGain = audioCtx.createGain();

        const whooshStart = now + 1.85 * invSpeed;
        const whooshDur = 1.35 * invSpeed;

        filter.frequency.setValueAtTime(280, whooshStart);
        filter.frequency.exponentialRampToValueAtTime(2600, whooshStart + whooshDur * 0.55);
        filter.frequency.exponentialRampToValueAtTime(500, whooshStart + whooshDur);

        whooshGain.gain.setValueAtTime(0.0001, whooshStart);
        whooshGain.gain.linearRampToValueAtTime(0.22, whooshStart + whooshDur * 0.45);
        whooshGain.gain.exponentialRampToValueAtTime(0.0001, whooshStart + whooshDur);

        if (audioCtx.createStereoPanner) {
          const whooshPanner = audioCtx.createStereoPanner();
          whooshPanner.pan.setValueAtTime(-0.65, whooshStart);
          whooshPanner.pan.linearRampToValueAtTime(0.65, whooshStart + whooshDur);
          whiteNoise.connect(filter).connect(whooshGain).connect(whooshPanner).connect(masterGain);
        } else {
          whiteNoise.connect(filter).connect(whooshGain).connect(masterGain);
        }
        whiteNoise.start(whooshStart);
        whiteNoise.stop(whooshStart + whooshDur + 0.1);

        // 4. Orchestral Warm Swell on Wordmark Lock
        const swellStart = now + 2.05 * invSpeed;
        const swellDur = 3.6 * invSpeed;
        const chordFreqs = [73.42, 110.00, 146.83, 220.00, 293.66, 369.99, 440.00, 587.33];

        chordFreqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const lpf = audioCtx.createBiquadFilter();
          const gain = audioCtx.createGain();

          osc.type = idx % 2 === 0 ? 'triangle' : 'sawtooth';
          osc.frequency.setValueAtTime(freq, swellStart);
          osc.detune.setValueAtTime((idx % 3 - 1) * 6, swellStart);

          lpf.type = 'lowpass';
          lpf.frequency.setValueAtTime(320, swellStart);
          lpf.frequency.exponentialRampToValueAtTime(3400, swellStart + 1.4 * invSpeed);
          lpf.frequency.exponentialRampToValueAtTime(950, swellStart + swellDur);

          gain.gain.setValueAtTime(0.0001, swellStart);
          gain.gain.linearRampToValueAtTime(0.065 / Math.sqrt(idx + 1), swellStart + 1.3 * invSpeed);
          gain.gain.exponentialRampToValueAtTime(0.0001, swellStart + swellDur);

          osc.connect(lpf).connect(gain).connect(masterGain);
          osc.start(swellStart);
          osc.stop(swellStart + swellDur + 0.1);
        });

        // 5. Metallic Impact Transient (Wordmark Lock Hit)
        const hitTime = now + 3.55 * invSpeed;
        const hitOsc = audioCtx.createOscillator();
        const hitGain = audioCtx.createGain();
        hitOsc.type = 'triangle';
        hitOsc.frequency.setValueAtTime(160, hitTime);
        hitOsc.frequency.exponentialRampToValueAtTime(40, hitTime + 0.5);
        hitGain.gain.setValueAtTime(0.0001, hitTime);
        hitGain.gain.linearRampToValueAtTime(0.55, hitTime + 0.015);
        hitGain.gain.exponentialRampToValueAtTime(0.0001, hitTime + 0.85);

        const metalOsc = audioCtx.createOscillator();
        const metalGain = audioCtx.createGain();
        metalOsc.type = 'square';
        metalOsc.frequency.setValueAtTime(880, hitTime);
        metalOsc.frequency.exponentialRampToValueAtTime(220, hitTime + 0.3);
        metalGain.gain.setValueAtTime(0.0001, hitTime);
        metalGain.gain.linearRampToValueAtTime(0.12, hitTime + 0.01);
        metalGain.gain.exponentialRampToValueAtTime(0.0001, hitTime + 0.35);

        hitOsc.connect(hitGain).connect(masterGain);
        metalOsc.connect(metalGain).connect(masterGain);
        hitOsc.start(hitTime);
        metalOsc.start(hitTime);
        hitOsc.stop(hitTime + 0.9);
        metalOsc.stop(hitTime + 0.4);

        setTimeout(() => {
          isAudioPlaying = false;
          if (soundBtnText) soundBtnText.textContent = 'Play Cinematic Audio';
        }, (swellStart - now + swellDur) * 1000);

      } catch (err) {
        console.warn('Audio context skipped:', err);
      }
    }

    /**
     * Render dynamic visualizer frequency bars on the canvas
     */
    function renderVisualizer() {
      const vCanvas = document.getElementById('visualizer-canvas');
      if (vCanvas) {
        const vCtx = vCanvas.getContext('2d');
        const w = vCanvas.width;
        const h = vCanvas.height;
        vCtx.clearRect(0, 0, w, h);

        const barCount = 28;
        const totalSpacing = w / barCount;
        const barWidth = totalSpacing * 0.65;
        const gap = totalSpacing * 0.35;

        if (analyser && analyserData && isAudioPlaying) {
          analyser.getByteFrequencyData(analyserData);
        }

        const t = Date.now() * 0.0028;

        for (let i = 0; i < barCount; i++) {
          let energy = 0;
          if (analyserData && isAudioPlaying) {
            energy = analyserData[i] || 0;
          } else {
            // Ambient breathing idle motion
            energy = (Math.sin(t + i * 0.32) * 0.5 + 0.5) * 26;
          }

          const barHeight = Math.max(3, (energy / 255) * (h - 4));
          const x = i * (barWidth + gap);
          const y = h - barHeight;

          const grad = vCtx.createLinearGradient(0, y, 0, h);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.35, 'rgba(255, 42, 95, 0.95)');
          grad.addColorStop(1, 'rgba(139, 0, 36, 0.25)');

          vCtx.fillStyle = grad;
          vCtx.beginPath();
          if (vCtx.roundRect) {
            vCtx.roundRect(x, y, barWidth, barHeight, [2, 2, 0, 0]);
          } else {
            vCtx.rect(x, y, barWidth, barHeight);
          }
          vCtx.fill();
        }
      }
      requestAnimationFrame(renderVisualizer);
    }

    /**
     * ========================================================================
     * 4. ANIMATION CONTROLLER & HUD EVENTS
     * ========================================================================
     */
    const viewport = document.getElementById('cinema-viewport');
    const phaseIndicator = document.getElementById('phase-indicator');
    const hudTop = document.getElementById('hud-top');
    const hudBottom = document.getElementById('hud-bottom');
    const btnReplay = document.getElementById('btn-replay');
    const btnSound = document.getElementById('btn-sound');
    const btnPause = document.getElementById('btn-pause');
    const btnCinema = document.getElementById('btn-cinema');
    const speedBtns = document.querySelectorAll('.speed-btn');

    let currentSpeed = 1;
    let isPaused = false;
    let isCinemaMode = false;
    let phaseTimers = [];

    function clearPhaseTimers() {
      phaseTimers.forEach((id) => clearTimeout(id));
      phaseTimers = [];
    }

    function schedulePhaseUpdates() {
      clearPhaseTimers();
      const inv = 1 / currentSpeed;

      phaseIndicator.textContent = 'Phase 1: Radiant "AM" Ruby Monogram';
      spawnSparkBurst(window.innerWidth / 2, window.innerHeight / 2, 40, 0.7);

      phaseTimers.push(
        setTimeout(() => {
          if (!isPaused) {
            phaseIndicator.textContent = 'Phase 2: Crimson Stardust Glide Transition';
            spawnSparkBurst(window.innerWidth / 2, window.innerHeight / 2, 95, 1.35);
          }
        }, 2000 * inv)
      );

      phaseTimers.push(
        setTimeout(() => {
          if (!isPaused) {
            phaseIndicator.textContent = 'Phase 3: Grand "ANAND MELAVA" Reveal';
            spawnSparkBurst(window.innerWidth / 2, window.innerHeight / 2, 50, 0.85);
          }
        }, 3600 * inv)
      );
    }

    function restartAnimation(withAudio = false) {
      isPaused = false;
      viewport.classList.remove('paused');
      btnPause.textContent = 'Pause';

      const shockwave = document.getElementById('shockwave-ring');

      // Re-trigger CSS animations cleanly by re-rendering wordmark
      buildArchedWordmark();

      // Reset shockwave animation
      if (shockwave) {
        shockwave.style.animation = 'none';
        void shockwave.offsetWidth;
        shockwave.style.animation = '';
      }

      schedulePhaseUpdates();

      if (withAudio) {
        playCinematicAudio(currentSpeed);
      }
    }

    function toggleCinemaMode() {
      isCinemaMode = !isCinemaMode;
      const opacityClass = isCinemaMode ? 'opacity-0' : 'opacity-100';
      const pointerClass = isCinemaMode ? 'pointer-events-none' : 'pointer-events-auto';

      hudTop.className = `fixed top-4 left-4 right-4 flex flex-wrap items-center justify-between gap-3 z-40 transition-opacity duration-500 ${opacityClass} ${isCinemaMode ? 'pointer-events-none' : ''}`;
      hudBottom.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-40 flex flex-wrap items-center justify-center gap-2.5 bg-neutral-950/90 border border-white/10 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-2xl transition-opacity duration-500 w-[92vw] max-w-2xl ${opacityClass} ${pointerClass}`;
      
      btnCinema.textContent = isCinemaMode ? 'Exit Cinema (H)' : 'Cinema Mode';
    }

    btnReplay.addEventListener('click', () => restartAnimation(false));
    btnSound.addEventListener('click', () => restartAnimation(true));

    btnPause.addEventListener('click', () => {
      isPaused = !isPaused;
      viewport.classList.toggle('paused', isPaused);
      btnPause.textContent = isPaused ? 'Resume' : 'Pause';
    });

    if (btnCinema) {
      btnCinema.addEventListener('click', toggleCinemaMode);
    }

    // Volume & Mute Controls
    const btnMute = document.getElementById('btn-mute');
    const volumeSlider = document.getElementById('volume-slider');
    let previousVolume = 0.85;

    function setMasterVolume(val) {
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(val, audioCtx.currentTime);
      }
      if (volumeSlider) volumeSlider.value = val;
      if (btnMute) {
        btnMute.style.opacity = val === 0 ? '0.4' : '1';
      }
    }

    if (volumeSlider) {
      volumeSlider.addEventListener('input', (e) => {
        initAudioEngine();
        const val = parseFloat(e.target.value);
        if (val > 0) previousVolume = val;
        setMasterVolume(val);
      });
    }

    if (btnMute) {
      btnMute.addEventListener('click', () => {
        initAudioEngine();
        const currentVal = masterGain ? masterGain.gain.value : parseFloat(volumeSlider.value);
        if (currentVal > 0) {
          previousVolume = currentVal;
          setMasterVolume(0);
        } else {
          setMasterVolume(previousVolume || 0.85);
        }
      });
    }

    speedBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        currentSpeed = parseFloat(btn.getAttribute('data-speed'));
        document.documentElement.style.setProperty('--speed-mult', currentSpeed);

        speedBtns.forEach((b) => {
          b.className = 'speed-btn px-2.5 py-1 rounded-lg text-xs text-neutral-400 hover:text-white transition';
        });
        btn.className = 'speed-btn px-2.5 py-1 rounded-lg text-xs bg-white/15 text-white font-medium transition';

        restartAnimation(false);
      });
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        restartAnimation(true);
      } else if (e.code === 'KeyH') {
        toggleCinemaMode();
      } else if (e.code === 'KeyP') {
        btnPause.click();
      } else if (e.code === 'KeyT') {
        toggleParallax();
      } else if (e.code === 'KeyC') {
        cycleCamera();
      } else if (e.code === 'KeyM') {
        if (btnMute) btnMute.click();
      } else if (e.code === 'Digit1') {
        applyTheme('crimson');
      } else if (e.code === 'Digit2') {
        applyTheme('cyberpunk');
      } else if (e.code === 'Digit3') {
        applyTheme('gold');
      } else if (e.code === 'Digit4') {
        applyTheme('emerald');
      }
    });

    /**
     * ========================================================================
     * 6. MULTI-UNIVERSE STUDIO CINEMA THEME ENGINE
     * ========================================================================
     */
    const themes = {
      crimson: {
        name: 'Crimson Stardust & Ruby',
        accentColor: '#ff2a5f',
        primary: '#e6194b',
        glow: '#ff2a5f',
        deep: '#8b0024',
        core: '#ff1e56',
        light: '#ffe5ec',
        viewportBg: 'radial-gradient(ellipse at 50% 50%, rgba(225, 29, 72, 0.24) 0%, rgba(136, 19, 55, 0.12) 38%, rgba(7, 2, 4, 0.95) 75%, rgba(4, 1, 2, 1) 100%)',
        embers: ['#ff2a5f', '#ff1e56', '#ff758f', '#ffb4a2', '#ffffff'],
        streakGrad: 'linear-gradient(90deg, transparent 0%, rgba(255, 42, 95, 0.05) 15%, rgba(255, 42, 95, 0.5) 45%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 42, 95, 0.5) 55%, rgba(255, 42, 95, 0.05) 85%, transparent 100%)'
      },
      cyberpunk: {
        name: 'Cyberpunk Neon & Violet',
        accentColor: '#4cc9f0',
        primary: '#7209b7',
        glow: '#4cc9f0',
        deep: '#3a0ca3',
        core: '#f72585',
        light: '#e0aaff',
        viewportBg: 'radial-gradient(ellipse at 50% 50%, rgba(114, 9, 183, 0.28) 0%, rgba(58, 12, 163, 0.16) 38%, rgba(3, 2, 10, 0.95) 75%, rgba(1, 0, 5, 1) 100%)',
        embers: ['#4cc9f0', '#f72585', '#7209b7', '#b5179e', '#ffffff'],
        streakGrad: 'linear-gradient(90deg, transparent 0%, rgba(76, 201, 240, 0.05) 15%, rgba(76, 201, 240, 0.6) 45%, rgba(255, 255, 255, 0.9) 50%, rgba(247, 37, 133, 0.6) 55%, rgba(76, 201, 240, 0.05) 85%, transparent 100%)'
      },
      gold: {
        name: 'Paramount Oscars 24K Gold',
        accentColor: '#ffd700',
        primary: '#d4af37',
        glow: '#ffd700',
        deep: '#583101',
        core: '#ffaa00',
        light: '#fff3b0',
        viewportBg: 'radial-gradient(ellipse at 50% 50%, rgba(212, 175, 55, 0.22) 0%, rgba(88, 49, 1, 0.14) 38%, rgba(6, 4, 1, 0.95) 75%, rgba(2, 1, 0, 1) 100%)',
        embers: ['#ffd700', '#ffaa00', '#fff3b0', '#e09f3e', '#ffffff'],
        streakGrad: 'linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.05) 15%, rgba(255, 215, 0, 0.6) 45%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 215, 0, 0.6) 55%, rgba(255, 215, 0, 0.05) 85%, transparent 100%)'
      },
      emerald: {
        name: 'Emerald Matrix & Sci-Fi Aurora',
        accentColor: '#10b981',
        primary: '#059669',
        glow: '#34d399',
        deep: '#064e3b',
        core: '#10b981',
        light: '#d1fae5',
        viewportBg: 'radial-gradient(ellipse at 50% 50%, rgba(16, 185, 129, 0.22) 0%, rgba(6, 78, 59, 0.14) 38%, rgba(2, 6, 4, 0.95) 75%, rgba(0, 2, 1, 1) 100%)',
        embers: ['#34d399', '#10b981', '#6ee7b7', '#a7f3d0', '#ffffff'],
        streakGrad: 'linear-gradient(90deg, transparent 0%, rgba(52, 211, 153, 0.05) 15%, rgba(52, 211, 153, 0.6) 45%, rgba(255, 255, 255, 0.9) 50%, rgba(16, 185, 129, 0.6) 55%, rgba(52, 211, 153, 0.05) 85%, transparent 100%)'
      }
    };

    let activeThemeKey = 'crimson';

    function applyTheme(key) {
      if (!themes[key]) return;
      activeThemeKey = key;
      const t = themes[key];

      document.documentElement.style.setProperty('--red-primary', t.primary);
      document.documentElement.style.setProperty('--red-glow', t.glow);
      document.documentElement.style.setProperty('--red-deep', t.deep);
      document.documentElement.style.setProperty('--crimson-core', t.core);
      document.documentElement.style.setProperty('--ruby-light', t.light);
      document.documentElement.style.setProperty('--ruby-accent', t.accentColor);

      viewport.style.background = t.viewportBg;

      const beam = document.querySelector('.anamorphic-beam');
      if (beam) beam.style.background = t.streakGrad;

      emberColors.splice(0, emberColors.length, ...t.embers);

      const nameDisplay = document.getElementById('theme-name-display');
      if (nameDisplay) {
        nameDisplay.textContent = t.name;
        nameDisplay.style.color = t.accentColor;
      }

      document.querySelectorAll('.theme-chip').forEach(btn => {
        const isCurrent = btn.getAttribute('data-theme') === key;
        btn.className = isCurrent 
          ? 'theme-chip px-2.5 py-0.5 rounded-full bg-white/20 border border-white/50 text-white font-medium transition active:scale-95 shadow-md'
          : 'theme-chip px-2.5 py-0.5 rounded-full bg-white/5 border border-transparent text-neutral-400 hover:text-white transition active:scale-95';
      });

      spawnSparkBurst(window.innerWidth / 2, window.innerHeight / 2, 45, 0.9);
    }

    document.querySelectorAll('.theme-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        applyTheme(btn.getAttribute('data-theme'));
      });
    });

    /**
     * ========================================================================
     * 5. 3D GYROSCOPE & MOUSE PARALLAX TILT ENGINE
     * ========================================================================
     */
    const parallaxRig = document.getElementById('parallax-rig');
    const btnParallax = document.getElementById('btn-parallax');
    const parallaxDot = document.getElementById('parallax-dot');

    let parallaxEnabled = true;
    let targetTiltX = 0;
    let targetTiltY = 0;
    let currentTiltX = 0;
    let currentTiltY = 0;
    let parallaxFrameId = null;

    function updateLensFlares(tiltX, tiltY) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const offsetX = tiltY * 22;
      const offsetY = -tiltX * 18;

      const g1 = document.getElementById('flare-ghost-1');
      const g2 = document.getElementById('flare-ghost-2');
      const g3 = document.getElementById('flare-ghost-3');
      const g4 = document.getElementById('flare-ghost-4');

      if (g1) g1.style.transform = `translate(${cx - 55 - offsetX * 0.45}px, ${cy - 55 - offsetY * 0.45}px)`;
      if (g2) g2.style.transform = `translate(${cx - 29 + offsetX * 0.8}px, ${cy - 29 + offsetY * 0.8}px)`;
      if (g3) g3.style.transform = `translate(${cx - 85 - offsetX * 1.25}px, ${cy - 85 - offsetY * 1.25}px)`;
      if (g4) g4.style.transform = `translate(${cx - 16 + offsetX * 1.6}px, ${cy - 16 + offsetY * 1.6}px)`;
    }

    /**
     * ========================================================================
     * 7. DIRECTOR CAMERA PRESETS ENGINE
     * ========================================================================
     */
    const cameraPresets = [
      { name: 'Center', basePitch: 0, baseYaw: 0, scale: 1.0, translateY: 0 },
      { name: 'Low IMAX', basePitch: 13, baseYaw: 0, scale: 1.1, translateY: 24 },
      { name: 'Horizon Pan', basePitch: 4, baseYaw: -14, scale: 0.95, translateY: 0 },
      { name: 'Isometric 3D', basePitch: -11, baseYaw: 16, scale: 1.03, translateY: -8 }
    ];

    let currentCameraIndex = 0;
    const btnCamera = document.getElementById('btn-camera');
    const cameraLabel = document.getElementById('camera-label');

    function cycleCamera() {
      currentCameraIndex = (currentCameraIndex + 1) % cameraPresets.length;
      const cam = cameraPresets[currentCameraIndex];
      if (cameraLabel) cameraLabel.textContent = `Cam: ${cam.name}`;
      spawnSparkBurst(window.innerWidth / 2, window.innerHeight / 2, 28, 0.7);
    }

    if (btnCamera) {
      btnCamera.addEventListener('click', cycleCamera);
    }

    function updateParallax() {
      if (parallaxEnabled) {
        currentTiltX += (targetTiltX - currentTiltX) * 0.08;
        currentTiltY += (targetTiltY - currentTiltY) * 0.08;
      } else {
        currentTiltX += (0 - currentTiltX) * 0.12;
        currentTiltY += (0 - currentTiltY) * 0.12;
      }

      const cam = cameraPresets[currentCameraIndex];
      const finalPitch = (currentTiltX + cam.basePitch).toFixed(2);
      const finalYaw = (currentTiltY + cam.baseYaw).toFixed(2);

      if (parallaxRig) {
        parallaxRig.style.transform = `perspective(1400px) translateY(${cam.translateY}px) scale(${cam.scale}) rotateX(${finalPitch}deg) rotateY(${finalYaw}deg)`;
      }

      updateLensFlares(currentTiltX + cam.basePitch * 0.4, currentTiltY + cam.baseYaw * 0.4);

      parallaxFrameId = requestAnimationFrame(updateParallax);
    }

    function toggleParallax() {
      parallaxEnabled = !parallaxEnabled;
      if (parallaxDot) {
        parallaxDot.className = parallaxEnabled 
          ? 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]'
          : 'w-2 h-2 rounded-full bg-neutral-500';
      }
      if (!parallaxEnabled) {
        targetTiltX = 0;
        targetTiltY = 0;
      }
    }

    window.addEventListener('mousemove', (e) => {
      if (!parallaxEnabled) return;
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      targetTiltY = ((e.clientX - cx) / cx) * 9.5;
      targetTiltX = -((e.clientY - cy) / cy) * 7.5;
    });

    window.addEventListener('deviceorientation', (e) => {
      if (!parallaxEnabled || e.gamma === null) return;
      targetTiltY = Math.min(Math.max(e.gamma, -30), 30) * 0.35;
      targetTiltX = -Math.min(Math.max(e.beta - 45, -30), 30) * 0.35;
    });

    // Interactive pointer click spark burst
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud-top') || e.target.closest('#hud-bottom')) return;
      spawnSparkBurst(e.clientX, e.clientY, 32, 0.9);
    });

    if (btnParallax) {
      btnParallax.addEventListener('click', toggleParallax);
    }

    window.addEventListener('resize', () => {
      computeGlideOffsets();
    });

    window.addEventListener('DOMContentLoaded', () => {
      initStarfield();
      renderStarfield();
      buildArchedWordmark();
      schedulePhaseUpdates();
      updateParallax();
      renderVisualizer();
    });
  </script>
</body>
</html>
